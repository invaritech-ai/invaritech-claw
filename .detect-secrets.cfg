# detect-secrets exclusion patterns (regex)
#
# This file is intentionally small for iclaw v1.

[exclude-files]
# pnpm lockfiles contain high-entropy package integrity blobs.
pattern = (^|/)pnpm-lock\.yaml$

[exclude-lines]
# CodingKeys and docs may refer to API key field names without containing secrets.
pattern = case apikey = "apiKey"
pattern = "apiKey"
pattern = ap[i]Key
